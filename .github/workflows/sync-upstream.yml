name: Sync Upstream
'on':
  schedule:
  - cron: 7 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare without pushing
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    uses: Murmansk-Seer/.github/.github/workflows/sync-identical-reusable.yml@af9f847cc3716ff424670557e232f5b18fc6ccd3
    with:
      implementation_ref: af9f847cc3716ff424670557e232f5b18fc6ccd3
      dry_run: ${{ inputs.dry_run == true }}
